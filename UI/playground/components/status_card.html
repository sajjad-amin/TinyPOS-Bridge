<!-- Printer Status Card -->
<div class="col-12 mb-3 mb-sm-4">
    <!-- Unconfigured Notice Banner -->
    <div class="alert alert-warning d-none align-items-center justify-content-between flex-wrap gap-2 shadow-sm border-0 rounded-4 mb-3 p-3" id="setup-alert" role="alert">
        <div class="d-flex align-items-center">
            <div class="p-2 bg-warning-subtle text-warning-emphasis rounded-3 me-2 me-sm-3">
                <i class="bi bi-key-fill fs-5 fs-sm-4"></i>
            </div>
            <div>
                <strong class="d-block small">Printing API Key Required</strong>
                <span class="text-body-secondary" style="font-size: 0.78rem;">Please configure your server URL and API key to connect to your thermal printer.</span>
            </div>
        </div>
        <button class="btn btn-warning btn-sm rounded-pill px-3 py-1 fw-semibold shadow-sm w-100 w-sm-auto mt-2 mt-sm-0" onclick="openConfigModal()">
            <i class="bi bi-gear-fill me-1"></i> Configure Key
        </button>
    </div>

    <!-- Live Status Hero Card -->
    <div class="card border-0 shadow-sm status-hero-modern" id="status-hero-card">
        <div class="card-body p-3 p-sm-4">
            <div class="d-flex flex-wrap align-items-center justify-content-between gap-3">
                <!-- Left: Icon & Details -->
                <div class="d-flex align-items-center">
                    <div id="printer-icon-box" class="p-2 p-sm-3 bg-secondary-subtle text-secondary rounded-4 me-2 me-sm-3 d-flex align-items-center justify-content-center shadow-sm flex-shrink-0" style="width: 48px; height: 48px;">
                        <i id="printer-icon" class="bi bi-printer-fill fs-4 fs-sm-3"></i>
                    </div>
                    <div>
                        <div class="d-flex align-items-center gap-1 gap-sm-2 mb-1 flex-wrap">
                            <h5 class="fw-bold mb-0 fs-6 fs-sm-5" id="printer-title">Thermal Printer</h5>
                            <span class="badge rounded-pill bg-secondary-subtle text-secondary border d-inline-flex align-items-center px-2 px-sm-3 py-1" id="printer-pill" style="font-size: 0.72rem;">
                                <span class="spinner-border spinner-border-sm me-1" style="width: 0.65rem; height: 0.65rem;"></span> Checking...
                            </span>
                            <span class="badge rounded-pill bg-success-subtle text-success border border-success-subtle d-none px-2 py-1" id="printer-battery-badge" style="font-size: 0.72rem;">
                                <i class="bi bi-battery-charging me-1"></i><span id="printer-battery-val">100%</span>
                            </span>
                        </div>
                        <div class="text-muted" id="printer-desc" style="font-size: 0.8rem; line-height: 1.3;">
                            Checking connection status with thermal printer bridge...
                        </div>
                        <!-- Hardware Specs Pill Strip -->
                        <div class="d-flex align-items-center flex-wrap gap-1 gap-sm-2 mt-2">
                            <span class="badge rounded-pill bg-body-tertiary border text-muted px-2 py-1" style="font-weight: 500; font-size: 0.7rem;">
                                <i class="bi bi-rulers me-1 text-primary"></i>57mm Roll
                            </span>
                            <span class="badge rounded-pill bg-body-tertiary border text-muted px-2 py-1" style="font-weight: 500; font-size: 0.7rem;">
                                <i class="bi bi-grid-3x3 me-1 text-info"></i>384 Dots
                            </span>
                            <span class="badge rounded-pill bg-body-tertiary border text-muted px-2 py-1" style="font-weight: 500; font-size: 0.7rem;">
                                <i class="bi bi-speedometer2 me-1 text-success"></i>203 DPI
                            </span>
                            <span class="badge rounded-pill bg-body-tertiary border text-muted px-2 py-1 d-none" id="printer-mode-badge" style="font-weight: 500; font-size: 0.7rem;">
                                <i class="bi bi-broadcast me-1 text-warning"></i><span id="printer-mode-text">Relay</span>
                            </span>
                        </div>
                    </div>
                </div>

                <!-- Right: Action Buttons (Responsive Grid on Mobile) -->
                <div class="d-flex align-items-center gap-1 gap-sm-2 w-100 w-lg-auto justify-content-between justify-content-lg-end mt-2 mt-lg-0">
                    <button class="btn btn-outline-secondary btn-sm rounded-pill px-2 px-sm-3 py-1 shadow-sm d-inline-flex align-items-center justify-content-center flex-fill flex-lg-grow-0 text-nowrap" onclick="feedPaper()" id="btn-feed" title="Feed paper">
                        <i class="bi bi-arrow-down-square me-1"></i> Feed
                    </button>
                    <button class="btn btn-outline-danger btn-sm rounded-pill px-2 px-sm-3 py-1 shadow-sm d-inline-flex align-items-center justify-content-center flex-fill flex-lg-grow-0 text-nowrap" onclick="emergencyStop()" id="btn-stop" disabled title="Cancel active print">
                        <i class="bi bi-stop-circle me-1"></i> Stop
                    </button>
                    <button class="btn btn-outline-primary btn-sm rounded-pill px-2 px-sm-3 py-1 shadow-sm d-inline-flex align-items-center justify-content-center flex-fill flex-lg-grow-0 text-nowrap" onclick="checkPrinterStatus(true)" id="btn-refresh" title="Refresh status">
                        <i class="bi bi-arrow-repeat me-1" id="refresh-icon"></i> Refresh
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
