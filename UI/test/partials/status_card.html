<!-- Printer Status Card -->
<div class="col-12">
    <div class="card border-0 shadow-sm">
        <div class="card-body p-3 d-flex flex-wrap align-items-center justify-content-between gap-3">
            <div class="d-flex align-items-center gap-3">
                <div class="p-3 bg-primary-subtle text-primary rounded-3" id="printer-icon-box">
                    <i class="bi bi-bluetooth fs-3" id="printer-icon"></i>
                </div>
                <div>
                    <h6 class="fw-bold mb-1 d-flex align-items-center gap-2">
                        Thermal Printer: 
                        <span id="printer-name" class="text-body-emphasis">Checking...</span>
                        <span id="printer-badge" class="badge bg-secondary-subtle text-secondary">Probing...</span>
                    </h6>
                    <div class="small text-muted font-monospace" id="printer-address">Checking connection status...</div>
                </div>
            </div>
            <div class="d-flex align-items-center gap-2">
                <span class="badge bg-body-secondary text-body-secondary border px-3 py-2">
                    Paper: <strong>57mm (384 dots)</strong>
                </span>
                <button class="btn btn-sm btn-primary" onclick="testFeedPaper()">
                    <i class="bi bi-arrow-down-circle me-1"></i> Feed Paper
                </button>
            </div>
        </div>
    </div>
</div>
