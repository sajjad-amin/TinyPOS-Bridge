<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title or "Sign In | TinyPOS" }}</title>
    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/icon.png">
    <link rel="apple-touch-icon" href="/static/icon.png">

    <!-- Bootstrap 5.3.3 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script>
        (function () {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-bs-theme', savedTheme);
        })();
    </script>
</head>

<body class="min-vh-100 d-flex flex-column bg-body-tertiary">
    <!-- Navbar -->
    <nav class="navbar navbar-expand bg-body border-bottom shadow-sm">
        <div class="container-fluid px-3 px-sm-4">
            <a class="navbar-brand d-flex align-items-center" href="/login">
                <img src="/static/icon.png" alt="TinyPOS" width="28" height="28" class="me-2 rounded shadow-sm">
                <span class="fw-bold">TinyPOS Bridge</span>
            </a>
            <div class="ms-auto d-flex align-items-center">
                <div class="form-check form-switch mb-0">
                    <input class="form-check-input" type="checkbox" role="switch" id="theme-toggle"
                        style="cursor: pointer;">
                    <label class="form-check-label" for="theme-toggle">
                        <i class="bi bi-moon-stars-fill"></i>
                    </label>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Centered -->
    <main class="flex-grow-1 d-flex align-items-center justify-content-center p-3 p-sm-4">
        <div class="w-100" style="max-width: 440px;">
            <div class="card border-0 shadow-sm rounded-4 overflow-hidden bg-body">
                <div class="card-body p-3 p-sm-4 p-md-4">
                    {% block content %}{% endblock %}
                </div>
            </div>
            <div class="text-center mt-3 small text-muted">
                TinyPOS Thermal Bridge &bull; 57mm Thermal POS
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const toggleBtn = document.getElementById('theme-toggle');
            if (toggleBtn) {
                const savedTheme = localStorage.getItem('theme') || 'dark';
                toggleBtn.checked = savedTheme === 'dark';

                toggleBtn.addEventListener('change', () => {
                    const newTheme = toggleBtn.checked ? 'dark' : 'light';
                    document.documentElement.setAttribute('data-bs-theme', newTheme);
                    localStorage.setItem('theme', newTheme);
                });
            }
        });
    </script>
</body>

</html>
