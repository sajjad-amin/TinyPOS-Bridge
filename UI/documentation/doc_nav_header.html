<!-- Code Examples Header with Key & Base URL Pre-fillers -->
<div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-3">
    <h6 class="fw-bold mb-0">Code Examples (Direct 1-Step Execution)</h6>
    <div class="d-flex flex-wrap align-items-center gap-2">
        <div class="d-flex align-items-center">
            <label for="baseUrlInput" class="form-label me-2 mb-0 small text-muted text-nowrap">Base URL:</label>
            <input type="text" class="form-control form-control-sm font-monospace" id="baseUrlInput" style="width: 230px;" oninput="updateBaseUrlPlaceholders(this.value)">
        </div>
        <div class="d-flex align-items-center">
            <label for="keySelector" class="form-label me-2 mb-0 small text-muted text-nowrap">API Key:</label>
            <select class="form-select form-select-sm" id="keySelector" style="width: 220px;" onchange="updateApiKeyPlaceholders(this)">
                {% if api_keys and api_keys|length > 0 %}
                    {% for k in api_keys %}
                    <option value="{{ k.key }}">{{ k.name }} ({{ k.key[:8] }}...)</option>
                    {% endfor %}
                {% else %}
                    <option value="sk_live_your_api_key_here">sk_live_your_api_key_here</option>
                {% endif %}
            </select>
        </div>
    </div>
</div>
