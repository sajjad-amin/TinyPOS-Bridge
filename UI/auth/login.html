{% extends "layouts/guest.html" %}

{% block content %}
<div class="text-center mb-4">
    <div class="d-inline-flex align-items-center justify-content-center bg-primary-subtle text-primary rounded-circle mb-3"
        style="width: 56px; height: 56px;">
        <i class="bi bi-shield-lock-fill fs-3"></i>
    </div>
    <h4 class="fw-bold">Sign In to TinyPOS</h4>
    <p class="text-muted small">Enter your admin credentials to access the thermal bridge</p>
</div>

{% if error %}
<div class="alert alert-danger py-2 small mb-3" role="alert">
    <i class="bi bi-exclamation-triangle-fill me-1"></i> {{ error }}
</div>
{% endif %}

<form method="POST" action="/login">
    <div class="mb-3">
        <label for="username" class="form-label small fw-semibold">Username</label>
        <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <input id="username" type="text" class="form-control" name="username" placeholder="Enter Username" required
                autofocus autocomplete="off">
        </div>
    </div>

    <div class="mb-3">
        <label for="password" class="form-label small fw-semibold">Password</label>
        <div class="input-group">
            <span class="input-group-text"><i class="bi bi-key"></i></span>
            <input id="password" type="password" class="form-control" name="password" placeholder="Enter Password"
                required autocomplete="off">
        </div>
    </div>

    <div class="mb-4 form-check">
        <input type="checkbox" class="form-check-input" id="remember" name="remember" checked>
        <label class="form-check-label small" for="remember">Remember this session</label>
    </div>

    <div class="d-grid">
        <button type="submit" class="btn btn-primary btn-lg fw-semibold">
            <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
        </button>
    </div>
</form>
{% endblock %}
